# debug.cfg -- OpenOCD configuration for debugging the Tab5 over the P4's
# built-in USB-Serial/JTAG (/dev/cu.usbmodem*).  Used by CLion's "Tab5 (OpenOCD)"
# Embedded GDB Server configuration, and works the same from the command line:
#
#   openocd -f debug.cfg
#   riscv32-esp-elf-gdb -ex 'target extended-remote localhost:3333' build/esp_protected.elf
#
# Take openocd from the same ESP-IDF install as the build (scripts/idf-env.sh
# puts it on PATH); its scripts directory comes from OPENOCD_SCRIPTS, or pass it
# with -s.  Stop OpenOCD before flashing -- esptool needs the same USB device.

# No FreeRTOS thread awareness, although this is an ESP-IDF (FreeRTOS) build.
# With it, the first stop after a reset replaces GDB's single pre-scheduler
# thread with one thread per task (thread 1 exits, 2..8 appear, and the stop is
# reported on thread 2 in the same instant).  CLion 2026.3 then fails with
# "Cannot retrieve info for thread 2" and never shows the pause: the session
# looks as if it is still running while the core sits halted at the
# breakpoint.  Measured: 2 of 3 CLion launches failed that way with awareness
# on, 0 of 3 with it off; plain GDB/MI answered -thread-info 2 correctly, so the
# fault is CLion's.  The cost is the per-task view: CLion shows one thread for
# the halted core instead of the FreeRTOS task list.
set ESP_RTOS none

source [find board/esp32p4-builtin.cfg]

# Turn every GDB breakpoint into a hardware one.  CLion's line breakpoints are
# software breakpoints, and the code this project is usually debugged in
# (user_main, umode.S, the trap path) is IRAM_ATTR: the second-stage bootloader
# copies IRAM from flash on every reset, after the debugger has written the
# ebreak, so a software breakpoint there is silently erased while GDB still
# shows it armed.  The cost is the trigger budget -- keep the number of enabled
# breakpoints small.
gdb breakpoint_override hard

# An IDE Stop halts the core before GDB detaches, which otherwise leaves the
# board frozen after every debug session.  Resume it on detach instead.
$_TARGETNAME_0 configure -event gdb-detach {
	if { [$_TARGETNAME_0 curstate] eq "halted" } { resume }
}
